<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050507">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Anime Rank — classement de personnages</title>
<style>
:root{
  --bg:#1a1e3c; --panel:#242a52; --panel2:#2f3764; --line:#3d4680; --text:#eef0ff; --mute:#9aa3d6; --accent:#ff4d6d;
  --force:#ff5a5f; --speed:#ffc93c; --abilities:#a78bfa; --iq:#4cc9f0; --durability:#4ade80;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif; --display:Impact,"Arial Narrow Bold","Haettenschweiler",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#2c3470 0,transparent 60%),var(--bg);color:var(--text);font:15px/1.45 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--iq);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;font-weight:400;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.btn{background:var(--accent);border:0;border-radius:8px;padding:11px 20px;font-weight:700;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.alt{background:var(--panel2);border:2px solid var(--line)}
input{background:var(--bg);border:2px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;width:100%}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px}
.mute{color:var(--mute)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
/* accueil */
.home{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:80vh}
.home h1{font-size:clamp(44px,7vw,92px);line-height:.95}
.home .cats{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:99px;font-weight:700;color:#14172e}
.forms{display:grid;gap:16px}
.forms label{display:block;margin-bottom:6px;font-weight:700}
.modes{display:flex;gap:8px}
.modes button{flex:1;padding:10px;border-radius:8px;background:var(--bg);border:2px solid var(--line);font-weight:700}
.modes button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.row{display:flex;gap:10px}

.home-career{position:fixed;top:18px;right:18px;z-index:70;display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.home-career .career-pill{padding:9px 13px;border-radius:999px;background:rgba(12,12,18,.86);border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 26px #0006;backdrop-filter:blur(10px);font-weight:900;font-size:13px}.home-career .career-pill b{font-family:var(--display);font-size:18px;margin-left:4px}@media(max-width:650px){.home-career{top:9px;right:9px;gap:5px}.home-career .career-pill{padding:6px 9px;font-size:11px}.home-career .career-pill b{font-size:15px}}
/* salon */
.lobby{max-width:640px;margin:8vh auto}
.slots{display:grid;gap:10px;margin:16px 0}
.slot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--bg);border:2px solid var(--line)}
.slot.empty{border-style:dashed;color:var(--mute)}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--panel2)}
.badge.ok{background:var(--durability);color:#10261a}.badge.warn{background:var(--speed);color:#2b2200}.badge.off{background:#555a7a}
/* jeu */
.top{display:flex;align-items:center;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.top .grow{flex:1;min-width:200px}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .5s}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.layout.p2 .others{grid-template-columns:1fr}
.me{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:14px;overflow:hidden;animation:flip .35s ease-out;position:relative;transition:border-color .25s,box-shadow .25s}
.roll-rarity{position:absolute;z-index:5;top:12px;left:12px;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(5px);box-shadow:0 4px 16px #0009;text-shadow:0 1px 3px #000}
.card.rarity-card-common{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af55,0 10px 28px #0008}.card.rarity-card-uncommon{border-color:#22c55e;box-shadow:0 0 8px #22c55e88,0 0 20px #22c55e33,0 10px 28px #0008}.card.rarity-card-rare{border-color:#3b82f6;box-shadow:0 0 10px #3b82f6aa,0 0 25px #3b82f655,0 10px 28px #0008}.card.rarity-card-epic{border-color:#a855f7;box-shadow:0 0 12px #a855f7cc,0 0 30px #a855f766,0 10px 28px #0008}.card.rarity-card-legendary{border-color:#ffe600}
@keyframes flip{from{transform:rotateY(70deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.avatar{aspect-ratio:4/3;display:grid;place-items:center;font:64px var(--display);color:rgba(255,255,255,.92);background-size:cover;background-position:center 22%;background-repeat:no-repeat}
.card .body{padding:14px}
.card h3{font-size:26px;line-height:1.05}
.stats{display:grid;gap:5px;margin-top:10px}
.stat{display:grid;grid-template-columns:78px 1fr 26px;gap:8px;align-items:center;font-size:13px}
.stat .bar{height:7px}.stat b{text-align:right}
.est{font-size:12px;color:var(--speed);margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.cell{min-height:150px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;border-top:6px solid var(--cat)}
.cell .lab{font-weight:700;color:var(--cat)}
.cell.free.pick{cursor:pointer;border-style:solid}
.cell.free.pick:hover,.cell.sel{background:var(--panel2);box-shadow:0 0 0 3px var(--cat)}
.cell.full{border-style:solid;background:var(--panel2)}
.cell .nm{font-weight:700;line-height:1.15}.cell .an{font-size:12px;color:var(--mute)}
.cell .val{margin-top:auto;font:28px var(--display);color:var(--cat)}
.others{display:grid;gap:12px;align-content:start}
.mini{padding:12px}
.mini h3{font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini .r{display:grid;grid-template-columns:8px 58px 1fr;gap:8px;align-items:center;font-size:13px;margin-top:7px}.mini .thumb{width:54px;height:48px;border-radius:6px;background-size:cover;background-position:center;border:1px solid var(--line);box-shadow:0 3px 10px #0008}.mini .r i{height:100%;min-height:44px}
.mini .r i{height:100%;min-height:44px;border-radius:3px;background:var(--cat)}
.mini .r span.e{color:var(--mute)}
.wait{margin-top:12px;color:var(--mute);font-weight:700}
/* fin */

.fight-cinematic{position:relative;z-index:1;width:100%;max-width:1050px;margin:auto}
.fight-cinematic h2{font-size:clamp(27px,5vw,52px);color:var(--text);text-shadow:3px 3px 0 var(--accent);margin-bottom:6px}
.fight-subtitle{color:var(--mute);margin-bottom:18px}
.fight-arena{display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,20px);min-height:210px;padding:18px 8px;background:radial-gradient(ellipse at center,#282033 0,rgba(5,5,8,.7) 72%);border:1px solid #4a4057;border-radius:12px;overflow:hidden}
.fight-card{width:min(210px,27%);min-width:0;overflow:hidden;background:#14141d;border:2px solid #4a4a5e;border-radius:10px;box-shadow:0 10px 24px #000b;opacity:0;animation:fightEnter .4s cubic-bezier(.2,.8,.2,1) forwards;transition:border-color .3s,box-shadow .3s}
.fight-card:nth-of-type(2){animation-delay:.08s}.fight-card:nth-of-type(3){animation-delay:.16s}.fight-card:nth-of-type(4){animation-delay:.24s}
.fight-card .thumb-stack{width:100%;padding:6px 6px 0}.fight-card .thumb{height:clamp(85px,13vw,150px);width:100%;border-radius:0;background-size:cover;background-position:center}.fight-card .rarity-label{font-size:9px;margin-top:2px}
.fight-card .fight-info{padding:8px;text-align:center}
.thumb-stack{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}.thumb-stack .thumb{flex-shrink:0}.rarity-label{display:inline-block;font-size:9px;line-height:1.15;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;border-radius:4px;background:#222;color:#ddd;border:1px solid #555;white-space:nowrap}.rarity-common{color:#d1d5db;border-color:#9ca3af}.rarity-uncommon{color:#86efac;border-color:#22c55e}.rarity-rare{color:#93c5fd;border-color:#3b82f6}.rarity-epic{color:#d8b4fe;border-color:#a855f7}.rarity-legendary{color:#fde68a;border-color:#f59e0b;background:linear-gradient(110deg,#422006,#713f12);text-shadow:0 0 8px #f59e0b}.card.legendary-card{border:3px solid #ffe600;box-shadow:0 0 5px #fff200,0 0 12px #ffe600,0 0 26px #ffd000,0 0 44px #ffbf00,inset 0 0 16px #ffe60033;animation:legendaryNeon 1.05s ease-in-out infinite alternate}.card.legendary-card .avatar{animation:legendaryGlow 1.25s ease-in-out infinite alternate}.card.legendary-card .body:before{content:"✦ LÉGENDAIRE ✦";display:block;text-align:center;color:#fcd34d;font-weight:900;letter-spacing:.18em;font-size:11px;margin:-4px 0 8px;animation:legendaryText 1s ease-in-out infinite alternate}.card.legendary-card.reroll-card{animation:legendaryReveal .7s cubic-bezier(.15,.85,.2,1) both!important}
@keyframes legendaryNeon{from{box-shadow:0 0 5px #fff200,0 0 12px #ffe600,0 0 24px #ffd000,0 0 38px #ffbf00,inset 0 0 12px #ffe60022}to{box-shadow:0 0 8px #fffbd1,0 0 18px #fff200,0 0 34px #ffe600,0 0 58px #ffbf00,inset 0 0 24px #ffe60044}}@keyframes legendaryGlow{from{filter:brightness(1);box-shadow:inset 0 0 0 transparent}to{filter:brightness(1.25) saturate(1.2);box-shadow:inset 0 0 32px #fbbf2466}}@keyframes legendaryText{from{text-shadow:0 0 2px #f59e0b;opacity:.8}to{text-shadow:0 0 12px #fbbf24;opacity:1}}@keyframes legendaryReveal{0%{opacity:0;transform:translateY(24px) scale(.94);filter:brightness(1)}45%{opacity:1;transform:translateY(-4px) scale(1.035);filter:brightness(1.7)}100%{opacity:1;transform:none;filter:brightness(1)}}
.fight-card .fight-name{display:block;font-weight:800;line-height:1.1;overflow-wrap:anywhere;font-size:clamp(11px,1.5vw,15px)}
.fight-card .fight-player{display:block;color:var(--mute);font-size:11px;overflow-wrap:anywhere;margin-top:4px}
.fight-card .fight-value{display:block;font:clamp(22px,3vw,32px) var(--display);color:var(--cat)}
.fight-card.champion{border-color:var(--cat);box-shadow:0 0 24px color-mix(in srgb,var(--cat),transparent 35%),0 12px 28px #000c;transform:translateY(-8px) scale(1.04);z-index:2}
.fight-card.pushed{animation:cardBubblePop 1s cubic-bezier(.2,.75,.2,1) forwards;pointer-events:none}.fight-card.exploding{overflow:visible;z-index:6}.bubble-shell{position:absolute;left:50%;top:50%;width:110%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.12);background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.75) 0 4%,rgba(255,255,255,.18) 5% 13%,transparent 15%),radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--cat),transparent 82%),rgba(130,210,255,.12) 58%,rgba(255,255,255,.32) 72%,rgba(120,210,255,.5) 78%,transparent 81%);border:2px solid rgba(210,245,255,.82);box-shadow:inset -12px -16px 28px rgba(80,170,255,.18),inset 9px 8px 20px rgba(255,255,255,.24),0 0 20px color-mix(in srgb,var(--cat),transparent 45%);z-index:12;pointer-events:none;animation:bubbleInflate .62s cubic-bezier(.12,.8,.2,1) forwards}.bubble-ring{position:absolute;left:50%;top:50%;width:105%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(220,248,255,.9);transform:translate(-50%,-50%) scale(.8);z-index:13;pointer-events:none;opacity:0;animation:bubbleShock .55s ease-out .58s forwards}.bubble-drop{position:absolute;left:50%;top:50%;width:var(--s,9px);height:var(--s,9px);border-radius:50%;background:rgba(205,242,255,.9);border:1px solid #fff;box-shadow:0 0 8px color-mix(in srgb,var(--cat),white 30%);z-index:14;pointer-events:none;opacity:0;animation:bubbleDrop .5s ease-out .58s forwards;--a:0deg;--d:90px}
.fight-vs{font:clamp(18px,3vw,32px) var(--display);color:var(--accent);text-shadow:2px 2px #000;flex:0 0 auto}
.fight-status{min-height:28px;margin-top:12px;color:var(--mute);font-weight:700}
@keyframes fightEnter{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes cardBubblePop{0%,55%{opacity:1;transform:scale(1);filter:none}62%{transform:scale(.96);filter:brightness(1.15)}68%{transform:scale(1.06);filter:brightness(1.5)}72%{opacity:1;transform:scale(1.1);filter:brightness(2)}100%{opacity:0;transform:scale(.82);filter:blur(5px) brightness(1.5)}}@keyframes bubbleInflate{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}18%{opacity:.9}78%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}92%{transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}@keyframes bubbleShock{0%{opacity:.95;transform:translate(-50%,-50%) scale(.78);border-width:4px}100%{opacity:0;transform:translate(-50%,-50%) scale(1.75);border-width:1px}}@keyframes bubbleDrop{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(40px) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.25)}}
@media(max-width:650px){.fight-arena{gap:4px;min-height:155px;padding:10px 3px}.fight-card{width:29%}.fight-card .fight-info{padding:5px 3px}.fight-card .fight-player{font-size:9px}.fight-vs{font-size:17px}}
@media(prefers-reduced-motion:reduce){.fight-card{animation:none!important;opacity:1!important}.fight-card.pushed{animation:none!important;opacity:.25!important}}

.winner-stage{position:relative;min-height:300px;display:grid;place-items:center;text-align:center;padding:30px 18px;margin-bottom:18px;overflow:hidden}
.winner-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(225,29,72,.18),transparent 62%);pointer-events:none}
.drums{position:relative;z-index:1;font:clamp(28px,6vw,68px) var(--display);text-transform:uppercase;letter-spacing:.05em;text-shadow:3px 3px 0 #000;animation:drumPulse .22s ease-in-out infinite alternate}
.drums small{display:block;font:700 13px var(--font);letter-spacing:.18em;color:var(--mute);margin-top:12px}
@keyframes drumPulse{from{transform:scale(.98);opacity:.72}to{transform:scale(1.02);opacity:1}}
.winner-result{position:relative;z-index:1;animation:winnerIn .45s cubic-bezier(.2,.8,.2,1) both;width:min(100%,1000px)}
@keyframes winnerIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.winner-result h1{font-size:clamp(42px,8vw,88px);color:var(--accent);text-shadow:4px 4px 0 #000;margin-bottom:14px}
.composition-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.composition{display:grid;grid-template-columns:1fr;gap:8px}
.comp-item{display:grid;grid-template-columns:120px 54px 1fr auto;gap:10px;align-items:center;background:rgba(20,20,28,.92);border:1px solid var(--line);border-left:3px solid var(--cat);border-radius:8px;padding:8px;text-align:left}
.comp-item .thumb{width:54px;height:54px;border-radius:6px;background-size:cover;background-position:center}
.comp-item .score{font:24px var(--display);color:var(--cat)}
.other-comps{margin-top:18px;animation:winnerIn .3s ease both}
.other-comps.hidden{display:none}
@media(max-width:1000px){.home,.layout,.me{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.others{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
@media(max-width:650px){.composition-row{grid-template-columns:1fr}.comp-item{grid-template-columns:90px 46px 1fr auto}.mini .r{grid-template-columns:6px 38px 1fr}.mini .thumb{width:38px;height:38px}.mini .r i{min-height:38px}}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-family:var(--display);font-weight:400;font-size:20px}
td .v{font:20px var(--display)}
@media(max-width:1000px){.home,.layout,.me{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.others{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Direction artistique manga ===== */
:root{--bg:#0b0b10;--panel:rgba(16,16,22,.9);--panel2:#23232e;--line:#3b3b4c;--text:#f4f4f8;--mute:#a8a8bb;--accent:#e11d48;--violet:#7c3aed;--volt:#38bdf8;--vc:.74;--ve:.34}
body{background:#050507;position:relative}
body.ingame{--vc:.9;--ve:.72}
#wall{transition:opacity .35s ease;position:fixed;inset:0;z-index:-2;overflow:hidden;background:#020204;contain:strict;pointer-events:none}
#wall::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:100;pointer-events:none}
#wall .pn{position:absolute;overflow:hidden;opacity:0;animation:pin .45s ease forwards;background:#e8e3d8;box-shadow:0 12px 28px #000e,0 2px 7px #000a;border:0;isolation:isolate;padding:4px;box-sizing:border-box;}
#wall .pn::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(80,70,55,.035) 0,rgba(80,70,55,.035) 1px,transparent 1px,transparent 3px),linear-gradient(135deg,rgba(255,255,255,.34),transparent 35%,rgba(0,0,0,.06));mix-blend-mode:multiply;}
#wall .pn::after{content:"";position:absolute;inset:1px;z-index:2;pointer-events:none;border:1px solid rgba(70,65,55,.12);background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 28%,transparent 72%,rgba(0,0,0,.14));mix-blend-mode:soft-light;}
#wall .pn img{position:relative;z-index:0;width:100%;height:100%;display:block;object-fit:cover;filter:brightness(.42) saturate(.68) contrast(1.15);}
#wall .pn.broken{display:none}
.card.reroll-card{animation:rerollCard .28s cubic-bezier(.2,.8,.25,1) both!important}
@keyframes rerollCard{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pin{to{opacity:1}}
#app{position:relative}
h1,h2,h3{text-transform:uppercase}
.btn{background:linear-gradient(135deg,var(--accent),var(--violet));border:1px solid rgba(255,255,255,.25);border-radius:6px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 0 0 rgba(225,29,72,0);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){box-shadow:0 0 22px rgba(225,29,72,.65),0 0 40px rgba(124,58,237,.35)}
.btn.alt,.btn.ghost{background:rgba(20,20,28,.92);border:1px solid #6a6a80}
.btn.alt:hover:not(:disabled),.btn.ghost:hover:not(:disabled){border-color:var(--volt);box-shadow:0 0 18px rgba(56,189,248,.55)}
.panel,table{border:1px solid var(--line);border-left:3px solid var(--accent)}
input{border:1px solid #55556a;background:rgba(8,8,12,.92)}
input:focus{border-color:var(--volt);box-shadow:0 0 14px rgba(56,189,248,.45)}
.profile-editor{display:flex;align-items:center;gap:10px;margin-top:10px}.profile-pic{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 0 14px rgba(255,45,85,.35);background:#171720}.profile-actions{display:flex;gap:7px;flex-wrap:wrap}.profile-actions label{margin:0!important;cursor:pointer}.profile-actions input{display:none}.player-pfp{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid #ffffff55}
/* accueil */
.home{display:flex;flex-direction:column;align-items:center;min-height:calc(100vh - 40px);position:relative}
.home label{display:block;font:700 12px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.home .who{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(360px,92%);padding:14px;background:rgba(10,10,15,.94);border:1px solid var(--accent);border-left:4px solid var(--accent);border-radius:10px;box-shadow:0 10px 32px #0009;z-index:2}
.home .hero{text-align:center;margin-top:15vh;max-width:620px}

function wallBuild() {
  const el = $('#wall'); if (!el) return;
  const small = innerWidth < 700;
  const images = [...WALL_IMAGES];
  for (let i = images.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [images[i], images[j]] = [images[j], images[i]];
  }

  // Toutes les images sont utilisées. On part d'une grille invisible très fine,
  // puis on décale chaque feuille aléatoirement : le fond est ainsi rempli de
  // partout, sans que deux feuilles reviennent systématiquement au même endroit.
  const cols = small ? 7 : 11;
  const rows = Math.ceil(images.length / cols);
  const cellW = 100 / cols;
  const cellH = 100 / rows;
  const positions = images.map((_, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const w = Math.min(15.5, cellW * (small ? 1.18 : 1.28)) + Math.random() * (small ? 3 : 4.5);
    const h = Math.min(15.5, cellH * (small ? 1.22 : 1.34)) + Math.random() * (small ? 3 : 4.5);
    const jitterX = (Math.random() - .5) * cellW * .72;
    const jitterY = (Math.random() - .5) * cellH * .72;
    const left = Math.max(-3, Math.min(100 - w + 3, col * cellW + (cellW - w) / 2 + jitterX));
    const top = Math.max(-3, Math.min(100 - h + 3, row * cellH + (cellH - h) / 2 + jitterY));
    return { w, h, left, top };
  });

  el.innerHTML = images.map((url, i) => {
    const {w,h,left,top} = positions[i];
    const rotate = (Math.random() * 34 - 17).toFixed(1);

    // Déchirures fines et nombreuses : irrégularités de 0,6 à 2,4 %,
    // avec de petits crans rapprochés pour imiter du papier arraché.
    const points = [];
    const edge = (count, axis, reverse = false) => {
      const arr = [];
      for (let n = 0; n < count; n++) {
        const t = n / (count - 1) * 100;
        const tear = 0.6 + Math.random() * 1.8;
        if (axis === 'top') arr.push(`${t.toFixed(1)}% ${tear.toFixed(1)}%`);
        if (axis === 'right') arr.push(`${(100-tear).toFixed(1)}% ${t.toFixed(1)}%`);
        if (axis === 'bottom') arr.push(`${t.toFixed(1)}% ${(100-tear).toFixed(1)}%`);
        if (axis === 'left') arr.push(`${tear.toFixed(1)}% ${t.toFixed(1)}%`);
      }
      return reverse ? arr.reverse() : arr;
    };
    points.push(...edge(13, 'top'));
    points.push(...edge(13, 'right'));
    points.push(...edge(13, 'bottom', true));
    points.push(...edge(13, 'left', true));
    const clip = `polygon(${points.join(',')})`;
    const style = `left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;width:${w.toFixed(2)}%;height:${h.toFixed(2)}%;transform:rotate(${rotate}deg);z-index:${i+1};clip-path:${clip};animation-delay:${Math.min(i*7,650)}ms`;
    return `<div class="pn" style="${style}"><img src="${url}" alt="" loading="eager" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('broken')"></div>`;
  }).join('');
}

function connect() {
  ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
  ws.onopen = () => { const s = store.get(); if (s) tx({ t: 'resume', code: s.code, token: s.token }); render(); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'session') store.set({ code: m.code, token: m.token });
    if (m.t === 'left') { store.clear(); S = null; sel = null; history.replaceState(null, '', '/'); render(); toast('Tu as quitté la partie.'); }
    if (m.t === 'cancelled') { store.clear(); S = null; sel = null; history.replaceState(null, '', '/'); render(); toast('La partie a été annulée.'); }
    if (m.t === 'state') {
      const prev = S;
      const animateView = localUiTransition;
      localUiTransition = false;
      S = m.state;
      if (S.status === 'playing' && (!prev || prev.status === 'lobby')) { preBattleUntil = Date.now() + 3200; if (preBattleTimer) clearTimeout(preBattleTimer); preBattleTimer = setTimeout(() => { preBattleUntil = 0; render(false); }, 3200); }
      rerollForMe = !!(m.action && m.action.type === 'reroll' && m.action.pid === S.me);
      const gotNewCard = S.status === 'playing' && S.current && (!prev || prev.me !== S.me || prev.currentRevision !== S.currentRevision);
      if (gotNewCard) {
        const obtained = S.chars[S.current];
        if (obtained && rarityOf(obtained).key === 'legendary') playGameSound('legendary');
      }
      if (!prev || prev.round !== S.round || S.me !== prev.me) { sel = null; lastPlacedCat = null; }
      history.replaceState(null, '', '?room=' + S.code);
      // Une action serveur distante reste silencieuse côté animation.
      render(animateView);
    }
    if (m.t === 'error') { toast(m.msg); if (m.fatal) { store.clear(); S = null; render(); } }
    busy = false;
  };
  ws.onclose = () => { toast('Connexion perdue — reconnexion…'); setTimeout(connect, 1500); };
}

  if (avg >= 72) return { key: 'rare', label: 'Rare' };

function fightCard(p, cat) {
  const c = p.grid[cat] && S.chars[p.grid[cat]];
  const value = c && c.stats ? Number(c.stats[cat]) || 0 : 0;
  return `<div class="fight-card" data-fight-id="${esc(p.id)}" style="--cat:var(--${cat})">${thumb(c)}<div class="fight-info"><span class="fight-name">${c ? esc(c.name) : 'Case vide'}</span><span class="fight-value">${value}</span><span class="fight-player">${esc(p.name)}</span></div></div>`;
}
function end() {
  const ranked = rankedPlayers();
  if (!winnerRevealed) {
    if (S.status === 'abandoned') return `<div class="top"><h2>Partie interrompue</h2><button class="btn ghost" id="leave" type="button">Retour à l'accueil</button></div><p class="mute">La partie a été interrompue avant la cinématique finale.</p>`;
    if (finishStep < 0) return `<div class="winner-stage panel"><div class="drums">Le combat final…<small>Préparez-vous !</small></div></div>`;
    const cat = CATS[Math.min(finishStep, CATS.length - 1)];
    return `<div class="top"><h2>Combat final</h2><button class="btn ghost" id="leave" type="button">Retour à l'accueil</button></div><div class="winner-stage panel"><div class="fight-cinematic"><h2>${LABEL[cat]}</h2><p class="fight-subtitle">Qui domine cette catégorie ?</p><div class="fight-arena" id="fightArena">${S.players.map((p) => fightCard(p, cat)).join('<div class="fight-vs">VS</div>')}</div><div class="fight-status" id="fightStatus">Les personnages entrent dans l'arène…</div></div></div>`;
  }
  const topScore = ranked[0]?.score ?? 0;
  const winners = ranked.filter((x) => x.score === topScore);
  const winnerText = winners.length === 1 ? `${esc(winners[0].p.name)} !` : 'Égalité !';
  const winner = winners[0]?.p;
  const others = ranked.filter((x) => !winners.includes(x));
  return `<div class="top"><h2>${S.status === 'abandoned' ? 'Partie interrompue' : 'Partie terminée'}</h2><div class="row">${S.hostId === S.me ? '<button class="btn" id="replay" type="button">Rejouer</button>' : ''}<button class="btn ghost" id="leave" type="button">Retour à l'accueil</button></div></div>
    <div class="winner-stage panel"><div class="winner-result"><h1>Le gagnant est ${winnerText}</h1><div class="composition-row"><div><h3 style="margin-bottom:10px">Composition du gagnant</h3>${winner ? composition(winner) : ''}</div><button class="btn alt" id="toggleComps" type="button">${showOtherComps ? 'Masquer les autres compositions' : 'Voir les autres compositions'}</button></div></div></div>
    <div class="other-comps ${showOtherComps ? '' : 'hidden'}">${others.map(({p,score}) => `<div class="panel" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:center"><h3>${esc(p.name)}</h3><span class="badge">Score : ${score}</span></div>${composition(p)}</div>`).join('')}</div>`;
}
const fightAudio = {
  win: new Audio('/gagnant.mp3'),
  lose: new Audio('/perdant.mp3')
};
const gameAudio = {
  legendary: new Audio('/legendaire.mp3'),
  reroll: new Audio('/rerol.mp3')
};
Object.values(gameAudio).forEach((audio) => { audio.preload = 'auto'; audio.volume = 0.2; });
function playGameSound(kind) {
  const audio = gameAudio[kind];
  if (!audio) return;
  try { audio.pause(); audio.currentTime = 0; audio.volume = 0.2; const r = audio.play(); if (r && r.catch) r.catch(() => {}); } catch (_) {}
}
Object.values(fightAudio).forEach((audio) => {
  audio.preload = 'auto';
  audio.volume = 0.2;
});
// La musique de défaite boucle jusqu'au retour à l'accueil.
fightAudio.lose.loop = true;
fightAudio.win.loop = false;
function unlockFightAudio() {
  // Précharge les sons après la première interaction utilisateur pour respecter
  // les règles d'autoplay des navigateurs. Le son ne démarre pas ici.
  [...Object.values(fightAudio), ...Object.values(gameAudio)].forEach((audio) => {
    try { audio.load(); } catch (_) { /* Audio facultatif. */ }
  });
}
document.addEventListener('pointerdown', unlockFightAudio, { once: true, passive: true });
function stopFightSounds() {
  Object.values(fightAudio).forEach((audio) => {
    try {
      audio.pause();
      audio.currentTime = 0;
    } catch (_) { /* Audio facultatif. */ }
  });
}
function playFightSound(kind) {
  // Un seul son de résultat doit être actif à la fois.
  stopFightSounds();
  const audio = fightAudio[kind === 'win' ? 'win' : 'lose'];
  if (!audio) return;
  try {
    audio.pause();
    audio.currentTime = 0;
    audio.volume = 0.2;
    const result = audio.play();
    if (result && typeof result.catch === 'function') result.catch(() => {
      // Certains navigateurs peuvent bloquer l'audio avant une interaction.
    });
  } catch (_) { /* Le son reste facultatif si le navigateur le bloque. */ }
}
function resolveFightRound() {
  const cat = CATS[Math.min(finishStep, CATS.length - 1)];
  const vals = S.players.map((p) => {
    const c = p.grid[cat] && S.chars[p.grid[cat]];
    return { p, value: c && c.stats ? Number(c.stats[cat]) || 0 : 0 };
  });
  const best = Math.max(...vals.map((x) => x.value));
  const localPlayer = S.players.find((p) => p.isMe);
  const localValue = vals.find((x) => localPlayer && x.p.id === localPlayer.id)?.value ?? -1;
  const arena = $('#fightArena');
  if (arena) arena.querySelectorAll('.fight-card').forEach((el) => {
    const item = vals.find((x) => x.p.id === el.dataset.fightId);
    if (item && item.value === best) el.classList.add('champion');
    else { el.classList.add('pushed','exploding'); const bubble=document.createElement('i');bubble.className='bubble-shell';el.appendChild(bubble);const ring=document.createElement('i');ring.className='bubble-ring';el.appendChild(ring);for(let i=0;i<16;i++){const q=document.createElement('i');q.className='bubble-drop';q.style.setProperty('--a',`${i*(360/16)+Math.random()*14-7}deg`);q.style.setProperty('--d',`${65+Math.random()*90}px`);q.style.setProperty('--s',`${4+Math.random()*8}px`);el.appendChild(q);} }
  });
  const winners = vals.filter((x) => x.value === best).map((x) => x.p.name);
  const status = $('#fightStatus');
  if (status) status.textContent = `${winners.join(' et ')} ${winners.length > 1 ? 'dominent' : 'domine'} en ${LABEL[cat].toLowerCase()} avec ${best}/100.`;
}

function render(animate = true) {
  const el = $('#app');
  if (finishTimer) { clearTimeout(finishTimer); finishTimer = null; }
  if (!S) { stopFightSounds(); careerResultRecorded = false; winnerRevealed = false; showOtherComps = false; finishStep = -1; finalOutcomeSoundPlayed = false; el.innerHTML = home(); }
  else if (S.status === 'lobby') { stopFightSounds(); winnerRevealed = false; showOtherComps = false; finishStep = -1; finalOutcomeSoundPlayed = false; el.innerHTML = lobby(); }
  else if (S.status === 'playing') { stopFightSounds(); winnerRevealed = false; showOtherComps = false; finishStep = -1; finalOutcomeSoundPlayed = false; el.innerHTML = game() + (preBattleUntil > Date.now() ? preBattleCinematic() : ''); }
  else if (S.status === 'finished' && !winnerRevealed) {
    el.innerHTML = end();
    if (finishStep < 0) {
      finishTimer = setTimeout(() => { finishStep = 0; render(false); }, 2000);
    } else {
      finishTimer = setTimeout(() => {
        resolveFightRound();
        finishTimer = setTimeout(() => {
          if (finishStep < CATS.length - 1) { finishStep += 1; render(false); }
          else { winnerRevealed = true; render(false); }
        }, 1050);
      }, 700);
    }
  } else {
    el.innerHTML = end();
    // Chaque client entend uniquement le son correspondant à son résultat final.
    if (S && S.status === 'finished' && winnerRevealed && !finalOutcomeSoundPlayed) {
      finalOutcomeSoundPlayed = true;
      recordCareerResult();
      const ranked = rankedPlayers();
      const topScore = ranked[0]?.score ?? 0;
      const localPlayer = S.players.find((p) => p.isMe);
      const localResult = ranked.find((entry) => localPlayer && entry.p.id === localPlayer.id);
      playFightSound(localResult && localResult.score === topScore ? 'win' : 'lose');
    }
  }
  document.body.classList.toggle('ingame', !!S);
  el.classList.remove('view-enter');
  if (animate) { void el.offsetWidth; el.classList.add('view-enter'); }
  bind();
  document.querySelectorAll('#playerCorner').forEach((x)=>x.remove());
  document.body.insertAdjacentHTML('beforeend', playerCorner());
  const corner=document.querySelector('#playerCorner'); if(corner){corner.onclick=openProfileEditor;corner.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProfileEditor();}};}
  rerollForMe = false;
}

function goHome() {
  // Coupe immédiatement la musique de résultat, notamment perdant.mp3 en boucle.
  stopFightSounds();
  localUiTransition = false;
  sel = null;
  busy = false;
  if (S && ws && ws.readyState === 1) {
    tx({ t: 'leave' });
    return;
  }
  store.clear();
  S = null;
  history.replaceState(null, '', '/');
  render();
}

function cancelGame() {
  if (!window.confirm('Annuler cette partie ? La partie sera supprimée pour tous les joueurs et chacun reviendra à l’accueil.')) return;
  if (ws && ws.readyState === 1) tx({ t: 'cancel' });
  else { store.clear(); S = null; history.replaceState(null, '', '/'); render(); }
}

function bind() {
  document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { const n = $('#name'), c = $('#code'); if (n) localStorage.setItem('animerank-name', n.value); if (c) history.replaceState(null, '', c.value ? '?room=' + c.value.toUpperCase() : '/'); mode = +b.dataset.mode; render(); });
  const name = () => { const v = ($('#name').value || '').trim(); if (!v) { toast('Entre un pseudo.'); return null; } localStorage.setItem('animerank-name', v); return v; };
  if ($('#saveName')) $('#saveName').onclick = () => { const v = name(); if (v) toast('Pseudo enregistré : ' + v); };
  if ($('#pfpInput')) $('#pfpInput').onchange = (e) => savePfpFile(e.target.files && e.target.files[0]);
  if ($('#create')) $('#create').onclick = () => { const n = name(); if (n) { localUiTransition = true; tx({ t: 'create', name: n, mode, pfp: getPfp() }); } };
  if ($('#join')) $('#join').onclick = () => { const n = name(); if (n) { localUiTransition = true; tx({ t: 'join', name: n, code: $('#code').value, pfp: getPfp() }); } };
  document.querySelectorAll('[data-setmode]').forEach((b) => b.onclick = () => { localUiTransition = true; tx({ t: 'mode', mode: +b.dataset.setmode }); });
  if ($('#ready')) $('#ready').onclick = () => { localUiTransition = true; tx({ t: 'ready', value: !S.players.find((p) => p.isMe).ready }); };
  if ($('#copy')) $('#copy').onclick = () => navigator.clipboard.writeText(`${location.origin}/?room=${S.code}`).then(() => toast('Lien copié.'), () => toast(`Code du salon : ${S.code}`));
  if ($('#homeLobby')) $('#homeLobby').onclick = goHome;
  if ($('#cancelLobby')) $('#cancelLobby').onclick = cancelGame;
  if ($('#homeGame')) $('#homeGame').onclick = goHome;
  document.querySelectorAll('[data-cell]').forEach((b) => b.onclick = () => { sel = b.dataset.cell; render(); });
  if ($('#reroll')) $('#reroll').onclick = () => { if (!busy) { playGameSound('reroll'); busy = true; localUiTransition = false; tx({ t: 'reroll' }); } };
  if ($('#accept')) $('#accept').onclick = () => { if (sel && !busy) { lastPlacedCat = sel; busy = true; localUiTransition = true; tx({ t: 'place', cat: sel }); } };
  if ($('#leaveGame')) $('#leaveGame').onclick = cancelGame;
  if ($('#toggleComps')) $('#toggleComps').onclick = () => { showOtherComps = !showOtherComps; render(); };
  if ($('#replay')) $('#replay').onclick = () => { stopFightSounds(); careerResultRecorded=false; winnerRevealed=false; finishStep=-1; finalOutcomeSoundPlayed=false; tx({t:'replay'}); setTimeout(stopFightSounds,80); setTimeout(stopFightSounds,300); };
  if ($('#leave')) $('#leave').onclick = goHome;
}
wallBuild();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
connect();
</script>
</body>
</html>
